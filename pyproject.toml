[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feiertage-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for German public holidays (feiertage-api.de) — holidays by year & state, is-it-a-holiday, next holiday & date ranges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
feiertage-mcp = "feiertage_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/feiertage_mcp"]
